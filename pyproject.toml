[tool.poetry]
name = "dotmac-bos"
version = "1.0.0"
description = "Business Operating System - Comprehensive ERP platform for business operations"
authors = ["Michael Ayoade <michaelayoade@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.109.0"
uvicorn = {extras = ["standard"], version = "^0.27.0"}
python-multipart = "^0.0.6"
sqlalchemy = "^2.0.25"
psycopg = {extras = ["binary"], version = "^3.1.0"}
alembic = "^1.13.1"
pydantic-settings = "^2.1.0"
httpx = "^0.26.0"
structlog = "^24.1.0"
tenacity = "^8.2.3"
python-dateutil = "^2.8.2"
celery = {extras = ["redis"], version = "^5.3.0"}
redis = "^5.0.0"
gunicorn = "^23.0.0"
python-jose = {extras = ["cryptography"], version = "^3.5.0"}
bcrypt = "^5.0.0"
pandas = "^2.2.0"
openpyxl = "^3.1.0"
prometheus-client = "^0.19.0"
jinja2 = "^3.1.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.23.0"
pytest-cov = "^5.0.0"
black = "^24.1.0"
ruff = "^0.1.14"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
plugins = ["sqlalchemy.ext.mypy.plugin"]
strict_optional = true
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = "--strict-markers"
markers = [
    "unit: Unit tests (fast, no external dependencies)",
    "critical: Critical path tests that must pass on every commit",
    "slow: Tests that take longer than 10 seconds",
    "integration: Integration tests requiring external services (PostgreSQL, Redis)",
    "e2e: End-to-end tests requiring full stack",
    "accounting: Accounting module tests",
    "crm: CRM module tests",
    "hr: HR module tests",
    "projects: Projects module tests",
    "support: Support module tests",
    "field_service: Field service module tests",
    "inbox: Inbox/conversations module tests",
    "inventory: Inventory module tests",
    "expenses: Expenses module tests",
]

[tool.coverage.run]
source = ["app"]
branch = true
omit = [
    "*/migrations/*",
    "*/__pycache__/*",
    "*/tests/*",
    "app/tasks/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
fail_under = 0
show_missing = true

[tool.coverage.html]
directory = "coverage_html"

[tool.coverage.xml]
output = "coverage.xml"
