# Pre-commit hooks for DotMAC Insights
#
# Install with: pre-commit install
# Run manually: pre-commit run --all-files
#
# Hooks run in the order listed below.
# See https://pre-commit.com for more information.

repos:
  # =============================================================================
  # GENERAL HOOKS
  # =============================================================================
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        exclude: ^frontend/
      - id: end-of-file-fixer
        exclude: ^frontend/
      - id: check-yaml
        args: [--unsafe]  # Allow custom tags
      - id: check-json
        exclude: ^frontend/package-lock\.json$
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-case-conflict

  # =============================================================================
  # PYTHON LINTING & FORMATTING
  # =============================================================================
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.0
    hooks:
      # Linter
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        types_or: [python, pyi]
      # Formatter
      - id: ruff-format
        types_or: [python, pyi]

  # =============================================================================
  # PYTHON TYPE CHECKING (optional - can be slow)
  # =============================================================================
  # Uncomment to enable type checking on commit
  # - repo: https://github.com/pre-commit/mirrors-mypy
  #   rev: v1.8.0
  #   hooks:
  #     - id: mypy
  #       additional_dependencies:
  #         - types-python-dateutil
  #         - sqlalchemy[mypy]
  #       args: [--ignore-missing-imports]
  #       exclude: ^(tests/|alembic/)

  # =============================================================================
  # LOCAL HOOKS
  # =============================================================================
  - repo: local
    hooks:
      # Quick smoke test on commit (fast, catches obvious issues)
      - id: pytest-smoke
        name: Run smoke tests
        entry: poetry run pytest tests/test_smoke.py -q --tb=line -x
        language: system
        pass_filenames: false
        stages: [pre-commit]
        # Only run if Python files changed
        types: [python]

      # Critical tests on push (more thorough)
      - id: pytest-critical
        name: Run critical tests
        entry: poetry run pytest -m critical --tb=short -q
        language: system
        pass_filenames: false
        stages: [pre-push]
        types: [python]

      # Frontend lint on commit (if frontend files changed)
      - id: frontend-lint
        name: Frontend lint
        entry: bash -c 'cd frontend && npm run lint'
        language: system
        pass_filenames: false
        stages: [pre-commit]
        files: ^frontend/.*\.(ts|tsx|js|jsx)$

      # Frontend type check on push
      - id: frontend-typecheck
        name: Frontend type check
        entry: bash -c 'cd frontend && npm run type-check'
        language: system
        pass_filenames: false
        stages: [pre-push]
        files: ^frontend/.*\.(ts|tsx)$

  # =============================================================================
  # SECRETS DETECTION
  # =============================================================================
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: |
          (?x)^(
            .*\.lock$|
            frontend/package-lock\.json$|
            .*\.min\.js$
          )$

# =============================================================================
# CONFIGURATION
# =============================================================================

# Files to exclude from all hooks
exclude: |
  (?x)^(
    \.git/|
    \.venv/|
    node_modules/|
    __pycache__/|
    \.mypy_cache/|
    \.pytest_cache/|
    alembic/versions/.*\.py$|
    frontend/\.next/|
    frontend/playwright-report/|
    frontend/test-results/
  )$

# CI configuration
ci:
  autofix_prs: true
  autoupdate_branch: main
  autoupdate_schedule: weekly
  skip: [pytest-smoke, pytest-critical, frontend-lint, frontend-typecheck]
