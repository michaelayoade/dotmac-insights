name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.11"
  POETRY_VERSION: "1.8.2"
  NODE_VERSION: "20"

jobs:
  # ====================
  # PYTHON LINTING
  # ====================
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: ${{ env.POETRY_VERSION }}
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ env.PYTHON_VERSION }}-${{ hashFiles('**/poetry.lock') }}

      - name: Install dependencies
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
        run: poetry install --no-interaction --no-root

      - name: Install project
        run: poetry install --no-interaction

      - name: Run ruff lint
        run: poetry run ruff check .

      - name: Run ruff format check
        run: poetry run ruff format --check .

  # ====================
  # PYTHON UNIT TESTS
  # ====================
  test-unit:
    name: Unit Tests (SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: ${{ env.POETRY_VERSION }}
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ env.PYTHON_VERSION }}-${{ hashFiles('**/poetry.lock') }}

      - name: Install dependencies
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
        run: poetry install --no-interaction --no-root

      - name: Install project
        run: poetry install --no-interaction

      - name: Run unit tests with coverage
        env:
          TEST_DATABASE_URL: "sqlite:///./test.db"
        run: |
          poetry run pytest tests/ \
            --ignore=tests/e2e \
            --ignore=tests/test_migrations.py \
            --ignore=tests/test_payroll_integration.py \
            --cov=app \
            --cov-report=xml:coverage-unit.xml \
            --cov-report=html:coverage-unit-html \
            --cov-report=term-missing \
            -v --tb=short \
            -m "not slow and not integration"

      - name: Upload unit test coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit
          path: |
            coverage-unit.xml
            coverage-unit-html/
          retention-days: 7

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage-unit.xml
          flags: unit
          name: unit-tests
        continue-on-error: true

  # ====================
  # PYTHON CRITICAL TESTS
  # ====================
  test-critical:
    name: Critical Path Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: ${{ env.POETRY_VERSION }}
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Load cached venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ env.PYTHON_VERSION }}-${{ hashFiles('**/poetry.lock') }}

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Run critical tests
        env:
          TEST_DATABASE_URL: "sqlite:///./test.db"
        run: |
          poetry run pytest tests/ \
            --ignore=tests/e2e \
            -m "critical" \
            -v --tb=short \
            --junit-xml=junit-critical.xml

      - name: Upload critical test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: critical-test-results
          path: junit-critical.xml
          retention-days: 7

  # ====================
  # PYTHON MIGRATION TESTS
  # ====================
  test-migrations:
    name: Migration Tests (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: migration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: ${{ env.POETRY_VERSION }}
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ env.PYTHON_VERSION }}-${{ hashFiles('**/poetry.lock') }}

      - name: Install dependencies
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
        run: poetry install --no-interaction --no-root

      - name: Install project
        run: poetry install --no-interaction

      - name: Run migration tests
        env:
          MIGRATION_TEST_DATABASE_URL: "postgresql://test:test@localhost:5432/migration_test"
        run: |
          poetry run pytest tests/test_migrations.py -v --tb=short

  # ====================
  # PYTHON INTEGRATION TESTS
  # ====================
  test-integration:
    name: Integration Tests (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: integration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: ${{ env.POETRY_VERSION }}
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ env.PYTHON_VERSION }}-${{ hashFiles('**/poetry.lock') }}

      - name: Install dependencies
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
        run: poetry install --no-interaction --no-root

      - name: Install project
        run: poetry install --no-interaction

      - name: Run database migrations
        env:
          DATABASE_URL: "postgresql://test:test@localhost:5432/integration_test"
        run: poetry run alembic upgrade head

      - name: Run integration tests with coverage
        env:
          TEST_DATABASE_URL: "postgresql://test:test@localhost:5432/integration_test"
          REDIS_URL: "redis://localhost:6379/0"
        run: |
          poetry run pytest tests/test_payroll_integration.py \
            tests/test_entitlement_gating.py \
            tests/test_bank_reconciliation_pagination.py \
            tests/test_webhooks_security.py \
            --cov=app \
            --cov-report=xml:coverage-integration.xml \
            -v --tb=short

      - name: Upload integration coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-integration
          path: coverage-integration.xml
          retention-days: 7

  # ====================
  # PYTHON E2E TESTS (Parallel by Module)
  # ====================
  test-e2e-python:
    name: E2E Tests - ${{ matrix.module }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [accounting, crm, hr, projects, support]
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: e2e_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: ${{ env.POETRY_VERSION }}
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Load cached venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ env.PYTHON_VERSION }}-${{ hashFiles('**/poetry.lock') }}

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Run database migrations
        env:
          DATABASE_URL: "postgresql://test:test@localhost:5432/e2e_test"
        run: poetry run alembic upgrade head

      - name: Run E2E tests for ${{ matrix.module }}
        env:
          TEST_DATABASE_URL: "postgresql://test:test@localhost:5432/e2e_test"
          REDIS_URL: "redis://localhost:6379/0"
        run: |
          poetry run pytest tests/e2e/${{ matrix.module }}/ \
            --cov=app \
            --cov-report=xml:coverage-e2e-${{ matrix.module }}.xml \
            -v --tb=short

      - name: Upload E2E coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-e2e-${{ matrix.module }}
          path: coverage-e2e-${{ matrix.module }}.xml
          retention-days: 7

  # ====================
  # FRONTEND BUILD & LINT
  # ====================
  frontend-build:
    name: Frontend Build & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  # ====================
  # FRONTEND UNIT TESTS (Vitest)
  # ====================
  test-frontend-unit:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests with coverage
        run: npm run test:coverage

      - name: Upload frontend coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-frontend
          path: frontend/coverage/
          retention-days: 7

  # ====================
  # FRONTEND E2E TESTS (Playwright)
  # ====================
  test-frontend-e2e:
    name: Frontend E2E Tests
    runs-on: ubuntu-latest
    needs: [frontend-build]
    defaults:
      run:
        working-directory: frontend

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: e2e_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python (for backend)
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: ${{ env.POETRY_VERSION }}
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install backend dependencies
        working-directory: .
        run: poetry install --no-interaction

      - name: Run migrations
        working-directory: .
        env:
          DATABASE_URL: "postgresql://test:test@localhost:5432/e2e_test"
        run: poetry run alembic upgrade head

      - name: Start backend server
        working-directory: .
        env:
          DATABASE_URL: "postgresql://test:test@localhost:5432/e2e_test"
          REDIS_URL: "redis://localhost:6379/0"
          JWT_SECRET: "test-jwt-secret-for-e2e-ci"
          API_KEY: "test-api-key"
        run: |
          poetry run uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          sleep 15  # Wait for server to start

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        env:
          E2E_BASE_URL: "http://localhost:3000"
          E2E_API_URL: "http://localhost:8000"
          E2E_JWT_SECRET: "test-jwt-secret-for-e2e-ci"
          CI: true
        run: npm run test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Upload Playwright traces
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: frontend/test-results/
          retention-days: 7

  # ====================
  # COVERAGE SUMMARY
  # ====================
  coverage-report:
    name: Coverage Summary
    runs-on: ubuntu-latest
    needs: [test-unit, test-integration, test-e2e-python, test-frontend-unit]
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Download all coverage artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          path: coverage-reports
          merge-multiple: true

      - name: Display coverage files
        run: |
          echo "Coverage reports downloaded:"
          find coverage-reports -type f -name "*.xml" 2>/dev/null || echo "No XML files found"
          ls -la coverage-reports/ 2>/dev/null || echo "No coverage-reports directory"

      - name: Upload combined coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          directory: coverage-reports
          flags: combined
          name: combined-coverage
        continue-on-error: true

      - name: Create coverage summary
        run: |
          echo "## Coverage Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Coverage reports have been uploaded as artifacts." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "- **coverage-unit**: Python unit test coverage" >> $GITHUB_STEP_SUMMARY
          echo "- **coverage-integration**: Python integration test coverage" >> $GITHUB_STEP_SUMMARY
          echo "- **coverage-e2e-***: Python E2E test coverage (by module)" >> $GITHUB_STEP_SUMMARY
          echo "- **coverage-frontend**: Frontend unit test coverage" >> $GITHUB_STEP_SUMMARY
          echo "- **playwright-report**: Frontend E2E test report" >> $GITHUB_STEP_SUMMARY
