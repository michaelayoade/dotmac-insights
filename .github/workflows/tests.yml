name: Tests

on:
  push:
    branches: [main, develop, 'feature/*', 'refactor/*']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"
  POETRY_VERSION: "1.7.1"

jobs:
  # ===========================================================================
  # LINT & TYPE CHECK
  # ===========================================================================
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install ruff mypy

      - name: Run Ruff
        run: ruff check app/ --output-format=github

      - name: Run Ruff Format Check
        run: ruff format --check app/

  # ===========================================================================
  # UNIT TESTS
  # ===========================================================================
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -e ".[test]"

      - name: Run Unit Tests
        run: |
          pytest tests/unit/ \
            -v \
            --tb=short \
            --cov=app/services \
            --cov-report=xml:coverage-unit.xml \
            --cov-report=term-missing \
            --cov-fail-under=50
        env:
          TEST_DATABASE_URL: "sqlite:///:memory:"

      - name: Upload Coverage
        uses: codecov/codecov-action@v4
        with:
          files: coverage-unit.xml
          flags: unit
          fail_ci_if_error: false

  # ===========================================================================
  # INTEGRATION TESTS
  # ===========================================================================
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -e ".[test]"

      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p 5432; do
            echo "Waiting for postgres..."
            sleep 2
          done

      - name: Run Integration Tests
        run: |
          pytest tests/integration/ \
            -v \
            --tb=short \
            --cov=app/api \
            --cov-report=xml:coverage-integration.xml \
            --cov-report=term-missing \
            -x
        env:
          TEST_DATABASE_URL: "postgresql+psycopg://test:test@localhost:5432/test_db"
          SECRET_KEY: "test-secret-key-for-ci"
          AUTH_DISABLED: "false"
          E2E_AUTH_ENABLED: "true"
          E2E_JWT_SECRET: "test-jwt-secret"

      - name: Upload Coverage
        uses: codecov/codecov-action@v4
        with:
          files: coverage-integration.xml
          flags: integration
          fail_ci_if_error: false

  # ===========================================================================
  # E2E TESTS
  # ===========================================================================
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: e2e_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -e ".[test]"

      - name: Run E2E Tests
        run: |
          pytest tests/e2e/ \
            -v \
            --tb=short \
            -m "not slow" \
            --cov=app \
            --cov-report=xml:coverage-e2e.xml \
            --timeout=300
        env:
          TEST_DATABASE_URL: "postgresql+psycopg://test:test@localhost:5432/e2e_db"
          REDIS_URL: "redis://localhost:6379/0"
          SECRET_KEY: "test-secret-key-for-ci"
          AUTH_DISABLED: "false"
          E2E_AUTH_ENABLED: "true"
          E2E_JWT_SECRET: "test-jwt-secret"

      - name: Upload Coverage
        uses: codecov/codecov-action@v4
        with:
          files: coverage-e2e.xml
          flags: e2e
          fail_ci_if_error: false

  # ===========================================================================
  # CRITICAL PATH TESTS (GATE)
  # ===========================================================================
  critical-tests:
    name: Critical Path Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -e ".[test]"

      - name: Run Critical Tests
        run: |
          pytest -m critical \
            -v \
            --tb=short \
            -x
        env:
          TEST_DATABASE_URL: "sqlite:///:memory:"
          SECRET_KEY: "test-secret-key"

  # ===========================================================================
  # SECURITY TESTS
  # ===========================================================================
  security-tests:
    name: Security Tests
    runs-on: ubuntu-latest
    needs: [unit-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -e ".[test]"
          pip install bandit safety

      - name: Run Bandit Security Scan
        run: |
          bandit -r app/ -ll -ii -x app/tests

      - name: Run Security Tests
        run: |
          pytest tests/ -m security \
            -v \
            --tb=short
        env:
          TEST_DATABASE_URL: "sqlite:///:memory:"
          SECRET_KEY: "test-secret-key"

      - name: Check Dependencies
        run: |
          pip freeze | safety check --stdin || true

  # ===========================================================================
  # COVERAGE REPORT
  # ===========================================================================
  coverage-report:
    name: Coverage Report
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, e2e-tests]
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Download all coverage reports
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          merge-multiple: true

      - name: Post Coverage Comment
        uses: py-cov-action/python-coverage-comment-action@v3
        with:
          GITHUB_TOKEN: ${{ github.token }}
          MERGE_COVERAGE_FILES: true

  # ===========================================================================
  # TEST SUMMARY
  # ===========================================================================
  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [lint, unit-tests, integration-tests, critical-tests]
    if: always()
    steps:
      - name: Check Results
        run: |
          echo "## Test Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Unit Tests | ${{ needs.unit-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Integration Tests | ${{ needs.integration-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Critical Tests | ${{ needs.critical-tests.result }} |" >> $GITHUB_STEP_SUMMARY

      - name: Fail if any required job failed
        if: |
          needs.lint.result == 'failure' ||
          needs.unit-tests.result == 'failure' ||
          needs.critical-tests.result == 'failure'
        run: exit 1
