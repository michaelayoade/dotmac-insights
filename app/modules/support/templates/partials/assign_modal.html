{# Assignment modal content for HTMX #}
<div class="p-4">
    <h3 class="text-lg font-medium text-gray-900 mb-4">Assign Ticket #{{ ticket.ticket_number }}</h3>

    <form hx-post="/support/tickets/{{ ticket.id }}/assign"
          hx-target="closest tr"
          hx-swap="outerHTML"
          x-data="{ submitting: false }"
          @submit="submitting = true">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

        <div class="space-y-4">
            {# Agent select #}
            <div>
                <label for="agent_id" class="block text-sm font-medium text-gray-700">Assign to Agent</label>
                <select name="agent_id" id="agent_id"
                        class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-primary-500 focus:ring-primary-500 sm:text-sm">
                    <option value="">-- Select Agent --</option>
                    {% for agent in agents %}
                    <option value="{{ agent.id }}"
                            {% if ticket.assigned_to_id == agent.id %}selected{% endif %}>
                        {{ agent.display_name or agent.email }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            {# Team select #}
            <div>
                <label for="team_id" class="block text-sm font-medium text-gray-700">Assign to Team</label>
                <select name="team_id" id="team_id"
                        class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-primary-500 focus:ring-primary-500 sm:text-sm">
                    <option value="">-- Select Team --</option>
                    {% for team in teams %}
                    <option value="{{ team.id }}"
                            {% if ticket.assigned_team_id == team.id %}selected{% endif %}>
                        {{ team.name }}
                    </option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <div class="mt-6 flex justify-end space-x-3">
            <button type="button" @click="$dispatch('close-modal')"
                    class="px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-md hover:bg-gray-50">
                Cancel
            </button>
            <button type="submit" :disabled="submitting"
                    class="px-4 py-2 text-sm font-medium text-white bg-primary-600 border border-transparent rounded-md hover:bg-primary-700 disabled:opacity-50">
                <span x-show="!submitting">Assign</span>
                <span x-show="submitting">Assigning...</span>
            </button>
        </div>
    </form>
</div>
