{% extends "layouts/app.html" %}

{% block content %}
<div class="space-y-6">
    <!-- Header -->
    <div class="flex items-center gap-3 mb-6">
        <a href="{% if team %}/hr/teams/{{ team.id }}{% else %}/hr/teams{% endif %}" class="text-gray-400 hover:text-gray-600">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
        </a>
        <div>
            <h1 class="text-2xl font-display font-bold text-gray-900">{{ page_title }}</h1>
            <p class="mt-1 text-sm text-gray-500">{% if team %}Edit team settings{% else %}Create a new helpdesk team{% endif %}</p>
        </div>
    </div>

    <form method="post" action="{% if team %}/hr/teams/{{ team.id }}{% else %}/hr/teams{% endif %}" class="space-y-6">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

        <!-- Basic Info -->
        <div class="bg-white rounded-2xl shadow-warm-sm ring-1 ring-gray-100 p-6">
            <h2 class="text-lg font-display font-semibold text-gray-900 mb-4">Team Information</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Team Name *</label>
                    <input type="text" name="team_name" value="{{ form_data.team_name if form_data else (team.team_name if team else '') }}" required
                        class="w-full px-4 py-2.5 border {% if errors.team_name %}border-red-300{% else %}border-gray-200{% endif %} rounded-xl focus:ring-2 focus:ring-primary-500 focus:border-primary-500"
                        placeholder="e.g., Support Team Alpha">
                    {% if errors.team_name %}
                    <p class="mt-1 text-sm text-red-600">{{ errors.team_name }}</p>
                    {% endif %}
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Assignment Rule</label>
                    <select name="assignment_rule" class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-primary-500 focus:border-primary-500">
                        <option value="">No automatic assignment</option>
                        {% for value, label in assignment_rules %}
                        <option value="{{ value }}" {% if (form_data.assignment_rule if form_data else (team.assignment_rule if team else '')) == value %}selected{% endif %}>{{ label }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="md:col-span-2">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Description</label>
                    <textarea name="description" rows="3"
                        class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-primary-500 focus:border-primary-500"
                        placeholder="Brief description of this team's purpose">{{ form_data.description if form_data else (team.description if team else '') }}</textarea>
                </div>
            </div>
        </div>

        <!-- Options -->
        <div class="bg-white rounded-2xl shadow-warm-sm ring-1 ring-gray-100 p-6">
            <h2 class="text-lg font-display font-semibold text-gray-900 mb-4">Options</h2>
            <label class="flex items-start gap-3 p-4 border border-gray-200 rounded-xl hover:bg-surface-50 cursor-pointer max-w-md">
                <input type="checkbox" name="ignore_restrictions" {% if (form_data and form_data.get('ignore_restrictions')) or (team and team.ignore_restrictions) %}checked{% endif %}
                    class="mt-1 h-4 w-4 rounded border-gray-300 text-primary-600 focus:ring-primary-500">
                <div>
                    <span class="block text-sm font-medium text-gray-900">Ignore Restrictions</span>
                    <span class="block text-xs text-gray-500">Team members can access all tickets regardless of assignment rules</span>
                </div>
            </label>
        </div>

        <div class="flex items-center justify-end gap-3">
            <a href="{% if team %}/hr/teams/{{ team.id }}{% else %}/hr/teams{% endif %}" class="px-4 py-2.5 border border-gray-200 rounded-xl hover:bg-surface-50 font-medium text-gray-600">
                Cancel
            </a>
            <button type="submit" class="px-4 py-2.5 bg-primary-600 text-white rounded-xl hover:bg-primary-700 font-medium">
                {{ 'Update Team' if team else 'Create Team' }}
            </button>
        </div>
    </form>
</div>
{% endblock %}
