{% extends "layouts/app.html" %}

{% block content %}
<div class="space-y-6">
    <!-- Header -->
    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
        <div>
            <h1 class="text-2xl font-display font-bold text-gray-900">Designations</h1>
            <p class="mt-1 text-sm text-gray-500">Manage job designations and titles</p>
        </div>
        <a href="/hr/designations/new" class="inline-flex items-center gap-2 px-4 py-2 bg-primary-600 text-white rounded-xl hover:bg-primary-700 font-medium text-sm">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"/></svg>
            New Designation
        </a>
    </div>

    <!-- Filters -->
    <div class="bg-white rounded-2xl shadow-warm-sm ring-1 ring-gray-100 p-4">
        <form hx-get="/hr/designations" hx-target="#table-container" hx-push-url="true" class="flex flex-col sm:flex-row gap-4">
            <div class="flex-1">
                <input type="text" name="q" value="{{ search_query }}" placeholder="Search designations..."
                    class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-primary-500 focus:border-primary-500">
            </div>
            <button type="submit" class="px-4 py-2.5 bg-primary-600 text-white rounded-xl hover:bg-primary-700 font-medium">
                Search
            </button>
            {% if search_query %}
            <a href="/hr/designations" class="px-4 py-2.5 border border-gray-200 rounded-xl hover:bg-surface-50 font-medium text-gray-600">
                Clear
            </a>
            {% endif %}
        </form>
    </div>

    <!-- Table -->
    <div id="table-container">
        {% include "modules/hr/templates/designations/partials/designations_table.html" %}
    </div>
</div>
{% endblock %}
