{% extends "layouts/app.html" %}

{% block page_header %}
<div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-8">
    <div>
        <nav class="flex items-center gap-2 text-sm text-gray-500 mb-2">
            <a href="/accounting/tax/filing" class="hover:text-primary-600">Tax Filing</a>
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
            </svg>
            <a href="/accounting/tax/filing/{{ period.id }}" class="hover:text-primary-600">{{ period.period_name }}</a>
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
            </svg>
            <span class="text-gray-900">Record Payment</span>
        </nav>
        <h1 class="text-2xl sm:text-3xl font-display font-bold text-gray-900 tracking-tight">Record Tax Payment</h1>
        <p class="mt-1.5 text-gray-500 font-body">Apply a payment against {{ period.period_name }}</p>
    </div>
</div>
{% endblock %}

{% block content %}
<form method="POST" action="/accounting/tax/filing/{{ period.id }}/pay" class="space-y-6">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

    <div class="bg-white rounded-2xl shadow-warm-sm ring-1 ring-gray-100 overflow-hidden">
        <div class="px-6 py-4 border-b border-gray-100">
            <h2 class="text-lg font-display font-semibold text-gray-900">Payment Details</h2>
        </div>
        <div class="p-6 space-y-4">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label for="payment_date" class="block text-sm font-medium text-gray-700 mb-1">
                        Payment Date <span class="text-red-500">*</span>
                    </label>
                    <input
                        type="date"
                        id="payment_date"
                        name="payment_date"
                        value="{{ today.strftime('%Y-%m-%d') if today else '' }}"
                        required
                        class="block w-full rounded-xl border-0 py-2.5 px-4 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-200 focus:ring-2 focus:ring-inset focus:ring-primary-500 sm:text-sm"
                    >
                </div>
                <div>
                    <label for="amount" class="block text-sm font-medium text-gray-700 mb-1">
                        Amount <span class="text-red-500">*</span>
                    </label>
                    <input
                        type="number"
                        id="amount"
                        name="amount"
                        step="0.01"
                        min="0"
                        required
                        placeholder="0.00"
                        class="block w-full rounded-xl border-0 py-2.5 px-4 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-200 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-primary-500 sm:text-sm"
                    >
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label for="payment_reference" class="block text-sm font-medium text-gray-700 mb-1">Payment Reference</label>
                    <input
                        type="text"
                        id="payment_reference"
                        name="payment_reference"
                        placeholder="Bank reference or receipt"
                        class="block w-full rounded-xl border-0 py-2.5 px-4 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-200 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-primary-500 sm:text-sm"
                    >
                </div>
                <div>
                    <label for="payment_method" class="block text-sm font-medium text-gray-700 mb-1">Payment Method</label>
                    <input
                        type="text"
                        id="payment_method"
                        name="payment_method"
                        placeholder="Transfer, card, cheque"
                        class="block w-full rounded-xl border-0 py-2.5 px-4 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-200 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-primary-500 sm:text-sm"
                    >
                </div>
            </div>

            <div>
                <label for="bank_account" class="block text-sm font-medium text-gray-700 mb-1">Bank Account</label>
                <input
                    type="text"
                    id="bank_account"
                    name="bank_account"
                    placeholder="Account name or number"
                    class="block w-full rounded-xl border-0 py-2.5 px-4 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-200 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-primary-500 sm:text-sm"
                >
            </div>
        </div>
    </div>

    <div class="flex items-center justify-end gap-3">
        <a href="/accounting/tax/filing/{{ period.id }}" class="px-4 py-2.5 rounded-xl text-sm font-semibold text-gray-700 bg-white border border-gray-200 hover:bg-surface-50">Cancel</a>
        <button type="submit" class="px-4 py-2.5 rounded-xl bg-primary-600 text-white text-sm font-semibold hover:bg-primary-500">Record Payment</button>
    </div>
</form>
{% endblock %}
