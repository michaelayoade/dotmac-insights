{% extends "layouts/app.html" %}

{% block page_header %}
<div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-8">
    <div>
        <h1 class="text-2xl sm:text-3xl font-display font-bold text-gray-900 tracking-tight">
            {{ page_title }}
        </h1>
        <p class="mt-1.5 text-gray-500 font-body">
            {% if is_edit %}Update tax code details{% else %}Create a new tax code{% endif %}
        </p>
    </div>
    <div class="flex items-center gap-3">
        <a
            href="/accounting/tax-codes{{ ('/' + (tax_code.id | string)) if tax_code else '' }}"
            class="inline-flex items-center gap-2 rounded-xl bg-white px-4 py-2.5 text-sm font-semibold text-gray-700 shadow-sm ring-1 ring-inset ring-gray-300 hover:bg-surface-50"
        >
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
            </svg>
            Cancel
        </a>
    </div>
</div>
{% endblock %}

{% block content %}
<form
    method="POST"
    action="/accounting/tax-codes{{ ('/' + (tax_code.id | string)) if is_edit else '' }}"
    class="space-y-6"
>
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

    <div class="bg-white rounded-2xl shadow-warm-sm ring-1 ring-gray-100 overflow-hidden">
        <div class="px-6 py-4 border-b border-gray-100">
            <h2 class="text-lg font-display font-semibold text-gray-900">Basics</h2>
        </div>
        <div class="p-6 grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
                <label for="code" class="block text-sm font-medium text-gray-700 mb-1">
                    Code <span class="text-red-500">*</span>
                </label>
                <input
                    type="text"
                    id="code"
                    name="code"
                    value="{{ tax_code.code if tax_code else '' }}"
                    {% if is_edit %}readonly{% else %}required{% endif %}
                    placeholder="e.g., STAMPDUTY"
                    class="block w-full rounded-xl border-0 py-2.5 px-4 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-200 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-primary-500 sm:text-sm {% if is_edit %}bg-gray-50{% endif %}"
                >
            </div>
            <div>
                <label for="name" class="block text-sm font-medium text-gray-700 mb-1">
                    Name <span class="text-red-500">*</span>
                </label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    value="{{ tax_code.name if tax_code else '' }}"
                    required
                    placeholder="Stamp Duty"
                    class="block w-full rounded-xl border-0 py-2.5 px-4 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-200 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-primary-500 sm:text-sm"
                >
            </div>
            <div class="sm:col-span-2">
                <label for="description" class="block text-sm font-medium text-gray-700 mb-1">Description</label>
                <textarea
                    id="description"
                    name="description"
                    rows="3"
                    placeholder="Optional description for internal use"
                    class="block w-full rounded-xl border-0 py-2.5 px-4 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-200 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-primary-500 sm:text-sm"
                >{{ tax_code.description if tax_code and tax_code.description else '' }}</textarea>
            </div>
        </div>
    </div>

    <div class="bg-white rounded-2xl shadow-warm-sm ring-1 ring-gray-100 overflow-hidden">
        <div class="px-6 py-4 border-b border-gray-100">
            <h2 class="text-lg font-display font-semibold text-gray-900">Tax Settings</h2>
        </div>
        <div class="p-6 grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
                <label for="rate" class="block text-sm font-medium text-gray-700 mb-1">
                    Rate (%)
                </label>
                <input
                    type="number"
                    id="rate"
                    name="rate"
                    step="0.0001"
                    min="0"
                    value="{{ tax_code.rate if tax_code else 0 }}"
                    class="block w-full rounded-xl border-0 py-2.5 px-4 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-200 focus:ring-2 focus:ring-inset focus:ring-primary-500 sm:text-sm"
                >
            </div>
            <div>
                <label for="tax_type" class="block text-sm font-medium text-gray-700 mb-1">Tax Type</label>
                <select
                    id="tax_type"
                    name="tax_type"
                    class="block w-full rounded-xl border-0 py-2.5 px-4 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-200 focus:ring-2 focus:ring-inset focus:ring-primary-500 sm:text-sm"
                >
                    {% for option in tax_type_options %}
                    <option
                        value="{{ option.value }}"
                        {{ 'selected' if (tax_code and tax_code.tax_type.value == option.value) or (not tax_code and option.value == 'both') else '' }}
                    >
                        {{ option.label }}
                    </option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label for="rounding_method" class="block text-sm font-medium text-gray-700 mb-1">Rounding Method</label>
                <select
                    id="rounding_method"
                    name="rounding_method"
                    class="block w-full rounded-xl border-0 py-2.5 px-4 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-200 focus:ring-2 focus:ring-inset focus:ring-primary-500 sm:text-sm"
                >
                    {% for option in rounding_method_options %}
                    <option
                        value="{{ option.value }}"
                        {{ 'selected' if (tax_code and tax_code.rounding_method.value == option.value) or (not tax_code and option.value == 'round') else '' }}
                    >
                        {{ option.label }}
                    </option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label for="rounding_precision" class="block text-sm font-medium text-gray-700 mb-1">Rounding Precision</label>
                <input
                    type="number"
                    id="rounding_precision"
                    name="rounding_precision"
                    min="0"
                    max="6"
                    value="{{ tax_code.rounding_precision if tax_code else 2 }}"
                    class="block w-full rounded-xl border-0 py-2.5 px-4 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-200 focus:ring-2 focus:ring-inset focus:ring-primary-500 sm:text-sm"
                >
            </div>
            <div class="sm:col-span-2 flex items-center gap-3">
                <input
                    type="checkbox"
                    id="is_tax_inclusive"
                    name="is_tax_inclusive"
                    {{ 'checked' if tax_code and tax_code.is_tax_inclusive else '' }}
                    class="h-4 w-4 rounded border-gray-300 text-primary-600 focus:ring-primary-500"
                >
                <label for="is_tax_inclusive" class="text-sm font-medium text-gray-700">
                    Tax Inclusive
                </label>
            </div>
        </div>
    </div>

    <div class="bg-white rounded-2xl shadow-warm-sm ring-1 ring-gray-100 overflow-hidden">
        <div class="px-6 py-4 border-b border-gray-100">
            <h2 class="text-lg font-display font-semibold text-gray-900">Accounting</h2>
        </div>
        <div class="p-6 grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
                <label for="account_head" class="block text-sm font-medium text-gray-700 mb-1">Account Head</label>
                <input
                    type="text"
                    id="account_head"
                    name="account_head"
                    value="{{ tax_code.account_head if tax_code else '' }}"
                    placeholder="VAT - Company"
                    class="block w-full rounded-xl border-0 py-2.5 px-4 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-200 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-primary-500 sm:text-sm"
                >
            </div>
            <div>
                <label for="cost_center" class="block text-sm font-medium text-gray-700 mb-1">Cost Center</label>
                <input
                    type="text"
                    id="cost_center"
                    name="cost_center"
                    value="{{ tax_code.cost_center if tax_code else '' }}"
                    placeholder="Main - Company"
                    class="block w-full rounded-xl border-0 py-2.5 px-4 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-200 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-primary-500 sm:text-sm"
                >
            </div>
            <div>
                <label for="company" class="block text-sm font-medium text-gray-700 mb-1">Company</label>
                <input
                    type="text"
                    id="company"
                    name="company"
                    value="{{ tax_code.company if tax_code else '' }}"
                    placeholder="Optional company scope"
                    class="block w-full rounded-xl border-0 py-2.5 px-4 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-200 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-primary-500 sm:text-sm"
                >
            </div>
        </div>
    </div>

    <div class="bg-white rounded-2xl shadow-warm-sm ring-1 ring-gray-100 overflow-hidden">
        <div class="px-6 py-4 border-b border-gray-100">
            <h2 class="text-lg font-display font-semibold text-gray-900">Jurisdiction & Validity</h2>
        </div>
        <div class="p-6 grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
                <label for="country" class="block text-sm font-medium text-gray-700 mb-1">Country</label>
                <input
                    type="text"
                    id="country"
                    name="country"
                    value="{{ tax_code.country if tax_code else '' }}"
                    placeholder="NG"
                    class="block w-full rounded-xl border-0 py-2.5 px-4 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-200 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-primary-500 sm:text-sm"
                >
            </div>
            <div>
                <label for="jurisdiction" class="block text-sm font-medium text-gray-700 mb-1">Jurisdiction</label>
                <input
                    type="text"
                    id="jurisdiction"
                    name="jurisdiction"
                    value="{{ tax_code.jurisdiction if tax_code else '' }}"
                    placeholder="Lagos"
                    class="block w-full rounded-xl border-0 py-2.5 px-4 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-200 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-primary-500 sm:text-sm"
                >
            </div>
            <div>
                <label for="valid_from" class="block text-sm font-medium text-gray-700 mb-1">Valid From</label>
                <input
                    type="date"
                    id="valid_from"
                    name="valid_from"
                    value="{{ tax_code.valid_from if tax_code and tax_code.valid_from else '' }}"
                    class="block w-full rounded-xl border-0 py-2.5 px-4 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-200 focus:ring-2 focus:ring-inset focus:ring-primary-500 sm:text-sm"
                >
            </div>
            <div>
                <label for="valid_to" class="block text-sm font-medium text-gray-700 mb-1">Valid To</label>
                <input
                    type="date"
                    id="valid_to"
                    name="valid_to"
                    value="{{ tax_code.valid_to if tax_code and tax_code.valid_to else '' }}"
                    class="block w-full rounded-xl border-0 py-2.5 px-4 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-200 focus:ring-2 focus:ring-inset focus:ring-primary-500 sm:text-sm"
                >
            </div>
            <div class="sm:col-span-2 flex items-center gap-3">
                <input
                    type="checkbox"
                    id="is_active"
                    name="is_active"
                    {{ 'checked' if (tax_code and tax_code.is_active) or not is_edit else '' }}
                    class="h-4 w-4 rounded border-gray-300 text-primary-600 focus:ring-primary-500"
                >
                <label for="is_active" class="text-sm font-medium text-gray-700">
                    Active
                </label>
            </div>
        </div>
    </div>

    <div class="flex items-center justify-end gap-3">
        <a
            href="/accounting/tax-codes{{ ('/' + (tax_code.id | string)) if tax_code else '' }}"
            class="px-4 py-2.5 rounded-xl text-sm font-semibold text-gray-700 bg-white border border-gray-200 hover:bg-surface-50"
        >
            Cancel
        </a>
        <button
            type="submit"
            class="px-4 py-2.5 rounded-xl bg-primary-600 text-white text-sm font-semibold hover:bg-primary-500"
        >
            {% if is_edit %}Update Tax Code{% else %}Create Tax Code{% endif %}
        </button>
    </div>
</form>
{% endblock %}
