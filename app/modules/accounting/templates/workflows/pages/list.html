{% extends "layouts/app.html" %}

{% block page_header %}
<div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-8">
    <div>
        <h1 class="text-2xl sm:text-3xl font-display font-bold text-gray-900 tracking-tight">Approval Workflows</h1>
        <p class="mt-1.5 text-gray-500 font-body">Configure document approval processes</p>
    </div>
    <div class="flex items-center gap-3">
        <a
            href="/accounting/workflows/new"
            class="inline-flex items-center gap-2 rounded-xl bg-primary-600 px-4 py-2.5 text-sm font-semibold text-white shadow-warm-sm hover:bg-primary-700 transition-colors"
        >
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
            </svg>
            New Workflow
        </a>
    </div>
</div>
{% endblock %}

{% block content %}
<!-- Filters -->
<div class="bg-white rounded-2xl shadow-warm-sm ring-1 ring-gray-100 p-4 mb-6">
    <form method="GET" class="flex flex-wrap items-center gap-4">
        <div class="flex-1 min-w-[200px]">
            <div class="relative">
                <input
                    type="text"
                    name="q"
                    value="{{ current_search or '' }}"
                    placeholder="Search workflows..."
                    class="block w-full rounded-xl border-0 py-2.5 pl-10 pr-4 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-200 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-primary-500 sm:text-sm"
                    hx-get="/accounting/workflows/table"
                    hx-target="#workflows-table"
                    hx-include="[name='doctype'], [name='status']"
                    hx-push-url="true"
                    hx-trigger="input changed delay:300ms, search"
                >
                <div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3">
                    <svg class="h-5 w-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                    </svg>
                </div>
            </div>
        </div>
        <div class="sm:w-48">
            <select
                name="doctype"
                class="block w-full rounded-xl border-0 py-2.5 px-4 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-200 focus:ring-2 focus:ring-inset focus:ring-primary-500 sm:text-sm"
                hx-get="/accounting/workflows/table"
                hx-target="#workflows-table"
                hx-include="[name='q'], [name='status']"
                hx-push-url="true"
                hx-trigger="change"
            >
                <option value="">All Document Types</option>
                {% for opt in doctype_options %}
                <option value="{{ opt.value }}" {{ 'selected' if current_doctype == opt.value else '' }}>{{ opt.label }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="sm:w-36">
            <select
                name="status"
                class="block w-full rounded-xl border-0 py-2.5 px-4 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-200 focus:ring-2 focus:ring-inset focus:ring-primary-500 sm:text-sm"
                hx-get="/accounting/workflows/table"
                hx-target="#workflows-table"
                hx-include="[name='q'], [name='doctype']"
                hx-push-url="true"
                hx-trigger="change"
            >
                <option value="">All Status</option>
                <option value="active" {{ 'selected' if current_status == 'active' else '' }}>Active</option>
                <option value="inactive" {{ 'selected' if current_status == 'inactive' else '' }}>Inactive</option>
            </select>
        </div>
    </form>
</div>

<!-- Workflows Table -->
<div id="workflows-table">
    {% include "modules/accounting/templates/workflows/partials/workflows_table.html" %}
</div>
{% endblock %}
