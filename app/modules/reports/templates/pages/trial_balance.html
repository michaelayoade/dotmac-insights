{% extends "layouts/app.html" %}

{% block content %}
<div class="space-y-6">
    <!-- Header -->
    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
        <div class="flex items-center gap-3">
            <a href="/reports" class="text-gray-400 hover:text-gray-600">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
            </a>
            <div>
                <h1 class="text-2xl font-display font-bold text-gray-900">Trial Balance</h1>
                <p class="mt-1 text-sm text-gray-500">Account balances as of {{ as_of }}</p>
            </div>
        </div>
    </div>

    <!-- Filters -->
    {% include "reports/partials/report_filters.html" %}

    <!-- Report Content -->
    <div class="bg-white rounded-2xl shadow-warm-sm ring-1 ring-gray-100" id="report-content"
         hx-get="/api/v1/accounting/trial-balance?as_of={{ as_of }}"
         hx-trigger="load"
         hx-swap="innerHTML">
        <div class="p-16 text-center">
            <div class="inline-flex items-center gap-2 text-gray-500">
                <svg class="w-5 h-5 animate-spin" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
                Loading report...
            </div>
        </div>
    </div>

    <!-- Report Table Template (shown after API call) -->
    <template id="trial-balance-template">
        <div class="overflow-x-auto">
            <table class="min-w-full divide-y divide-gray-100">
                <thead>
                    <tr class="bg-surface-50">
                        <th class="py-3.5 pl-6 pr-3 text-left text-xs font-semibold uppercase tracking-wider text-gray-500">Account</th>
                        <th class="px-3 py-3.5 text-left text-xs font-semibold uppercase tracking-wider text-gray-500">Type</th>
                        <th class="px-3 py-3.5 text-right text-xs font-semibold uppercase tracking-wider text-gray-500">Debit</th>
                        <th class="py-3.5 pl-3 pr-6 text-right text-xs font-semibold uppercase tracking-wider text-gray-500">Credit</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-gray-100" id="trial-balance-body">
                    <!-- Rows will be populated by JavaScript -->
                </tbody>
                <tfoot class="bg-surface-50">
                    <tr>
                        <td colspan="2" class="py-3.5 pl-6 pr-3 text-sm font-semibold text-gray-900">Total</td>
                        <td class="px-3 py-3.5 text-right text-sm font-semibold text-gray-900" id="total-debit">0.00</td>
                        <td class="py-3.5 pl-3 pr-6 text-right text-sm font-semibold text-gray-900" id="total-credit">0.00</td>
                    </tr>
                </tfoot>
            </table>
        </div>
    </template>
</div>

<style>
@media print {
    .no-print { display: none !important; }
    body { background: white; }
    .shadow-warm-sm, .shadow-warm-md { box-shadow: none !important; }
    .ring-1 { ring-width: 0 !important; }
}
</style>
{% endblock %}
