{% extends "layouts/app.html" %}

{% block content %}
<div class="max-w-7xl mx-auto">

    {# Page Header #}
    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-8 animate-fade-up">
        <div class="relative">
            <div class="absolute -left-4 top-1 bottom-1 w-1 bg-gradient-to-b from-red-500 to-orange-500 rounded-full"></div>
            <h1 class="text-2xl font-bold text-gray-900 tracking-tight font-display">Alerts</h1>
            <p class="mt-1 text-sm text-gray-500 font-body">Active and recent network alerts</p>
        </div>
        <div class="flex items-center gap-3">
            <a href="/network/noc" class="text-sm text-primary-600 hover:text-primary-700">
                ← Back to NOC
            </a>
            <div class="flex items-center gap-2">
                <span class="text-xs text-gray-500">Auto-refresh</span>
                <div class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></div>
            </div>
        </div>
    </div>

    {# Filter Tabs #}
    <div class="flex items-center gap-2 mb-6 border-b border-gray-200">
        <button class="px-4 py-2 text-sm font-medium border-b-2 border-primary-500 text-primary-600"
                hx-get="/network/noc/partials/alerts-table?status=active"
                hx-target="#alerts-container"
                hx-swap="innerHTML">
            Active ({{ stats.active }})
        </button>
        <button class="px-4 py-2 text-sm font-medium text-gray-500 hover:text-gray-700 border-b-2 border-transparent"
                hx-get="/network/noc/partials/alerts-table?status=acknowledged"
                hx-target="#alerts-container"
                hx-swap="innerHTML">
            Acknowledged ({{ stats.acknowledged }})
        </button>
        <button class="px-4 py-2 text-sm font-medium text-gray-500 hover:text-gray-700 border-b-2 border-transparent"
                hx-get="/network/noc/partials/alerts-table?status=resolved"
                hx-target="#alerts-container"
                hx-swap="innerHTML">
            Resolved (24h)
        </button>
    </div>

    {# Severity Filter #}
    <div class="flex items-center gap-2 mb-6">
        <span class="text-sm text-gray-500">Severity:</span>
        <div class="flex items-center gap-1">
            <button class="px-3 py-1 text-xs font-medium rounded-full bg-red-100 text-red-700 hover:bg-red-200"
                    hx-get="/network/noc/partials/alerts-table?severity=critical"
                    hx-target="#alerts-container">
                Critical ({{ stats.critical }})
            </button>
            <button class="px-3 py-1 text-xs font-medium rounded-full bg-amber-100 text-amber-700 hover:bg-amber-200"
                    hx-get="/network/noc/partials/alerts-table?severity=warning"
                    hx-target="#alerts-container">
                Warning ({{ stats.warning }})
            </button>
            <button class="px-3 py-1 text-xs font-medium rounded-full bg-blue-100 text-blue-700 hover:bg-blue-200"
                    hx-get="/network/noc/partials/alerts-table?severity=info"
                    hx-target="#alerts-container">
                Info ({{ stats.info }})
            </button>
            <button class="px-3 py-1 text-xs font-medium rounded-full bg-gray-100 text-gray-700 hover:bg-gray-200"
                    hx-get="/network/noc/partials/alerts-table"
                    hx-target="#alerts-container">
                All
            </button>
        </div>
    </div>

    {# Alerts Table #}
    <div class="bg-white rounded-2xl border border-gray-100 shadow-warm overflow-hidden"
         id="alerts-container"
         hx-get="/network/noc/partials/alerts-table"
         hx-trigger="every 30s"
         hx-swap="innerHTML">
        {% include "network/noc/partials/alerts_table.html" %}
    </div>
</div>
{% endblock %}
