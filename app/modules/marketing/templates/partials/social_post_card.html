<div class="bg-white rounded-2xl shadow-warm-sm ring-1 ring-gray-100 p-5 hover:shadow-warm transition-shadow">
    <div class="flex items-center justify-between">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-indigo-50 flex items-center justify-center">
                {% include "components/icons/globe.html" %}
            </div>
            <div>
                <p class="text-sm font-medium text-gray-900">{{ post.title | default('') }}</p>
                <p class="text-xs text-gray-500">{{ post.platforms | default('') }}</p>
            </div>
        </div>
        <span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium
            {% if post.status == 'scheduled' %}bg-blue-50 text-blue-700
            {% elif post.status == 'published' %}bg-emerald-50 text-emerald-700
            {% elif post.status == 'failed' %}bg-red-50 text-red-700
            {% else %}bg-gray-100 text-gray-600{% endif %}">
            {{ post.status | default('') | replace('_', ' ') | title }}
        </span>
    </div>
    <p class="text-sm text-gray-600 mt-3 line-clamp-2">{{ post.excerpt | default('') }}</p>
    <div class="mt-4 flex items-center justify-between text-xs text-gray-500">
        <span>{{ post.scheduled_at | default('--') }}</span>
        <span>{{ post.owner | default('') }}</span>
    </div>
</div>
