<div class="bg-white rounded-2xl shadow-warm-sm ring-1 ring-gray-100 p-5 hover:shadow-warm transition-shadow">
    <div class="flex items-center justify-between">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-slate-100 flex items-center justify-center">
                {% include "components/icons/settings.html" %}
            </div>
            <div>
                <p class="text-sm font-semibold text-gray-900">{{ integration.name | default('') }}</p>
                <p class="text-xs text-gray-500">{{ integration.description | default('') }}</p>
            </div>
        </div>
        <span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium
            {% if integration.status == 'connected' %}bg-emerald-50 text-emerald-700
            {% elif integration.status == 'pending' %}bg-amber-50 text-amber-700
            {% else %}bg-gray-100 text-gray-600{% endif %}">
            {{ integration.status | default('') | replace('_', ' ') | title }}
        </span>
    </div>
    <div class="mt-4 flex items-center justify-between text-sm">
        <span class="text-gray-500">Last synced {{ integration.last_synced | default('--') }}</span>
        <a href="{{ integration.href | default('/marketing/integrations') }}" class="text-primary-600 hover:text-primary-700 font-medium">Manage</a>
    </div>
</div>
