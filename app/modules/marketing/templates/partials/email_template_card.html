<div class="bg-white rounded-2xl shadow-warm-sm ring-1 ring-gray-100 p-5 hover:shadow-warm transition-shadow">
    <div class="flex items-start justify-between gap-3">
        <div>
            <p class="text-xs uppercase tracking-wider text-gray-500">{{ template.category | default('') }}</p>
            <h3 class="text-lg font-display font-semibold text-gray-900 mt-1">{{ template.name | default('') }}</h3>
        </div>
        <span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium bg-slate-100 text-slate-600">
            {{ template.status | default('') | replace('_', ' ') | title }}
        </span>
    </div>
    <p class="text-sm text-gray-600 mt-3 line-clamp-2">{{ template.preview | default('') }}</p>
    <div class="mt-4 flex items-center justify-between text-xs text-gray-500">
        <span>{{ template.last_updated | default('--') }}</span>
        <span>{{ template.owner | default('') }}</span>
    </div>
</div>
