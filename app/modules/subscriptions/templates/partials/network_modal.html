{# Network assignment modal #}
<div
    class="fixed inset-0 z-50 overflow-y-auto"
    x-data="{ open: true }"
    x-show="open"
    x-transition:enter="ease-out duration-300"
    x-transition:enter-start="opacity-0"
    x-transition:enter-end="opacity-100"
    x-transition:leave="ease-in duration-200"
    x-transition:leave-start="opacity-100"
    x-transition:leave-end="opacity-0"
>
    <!-- Backdrop -->
    <div class="fixed inset-0 bg-gray-900/50 backdrop-blur-sm" @click="open = false; setTimeout(() => $el.parentElement.remove(), 200)"></div>

    <!-- Modal -->
    <div class="flex min-h-full items-center justify-center p-4">
        <div
            class="relative w-full max-w-lg transform overflow-hidden rounded-2xl bg-white shadow-2xl transition-all"
            x-show="open"
            x-transition:enter="ease-out duration-300"
            x-transition:enter-start="opacity-0 scale-95"
            x-transition:enter-end="opacity-100 scale-100"
            x-transition:leave="ease-in duration-200"
            x-transition:leave-start="opacity-100 scale-100"
            x-transition:leave-end="opacity-0 scale-95"
            @click.away="open = false; setTimeout(() => $el.parentElement.parentElement.remove(), 200)"
        >
            <form
                method="POST"
                action="/subscriptions/{{ subscription.id }}/network"
                hx-patch="/subscriptions/{{ subscription.id }}/network"
                hx-swap="none"
            >
                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

                <div class="px-6 py-5 border-b border-gray-100">
                    <div class="flex items-center gap-4">
                        <div class="flex-shrink-0 w-12 h-12 rounded-xl bg-cyan-100 flex items-center justify-center">
                            <svg class="w-6 h-6 text-cyan-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9"/>
                            </svg>
                        </div>
                        <div>
                            <h3 class="text-lg font-display font-semibold text-gray-900">Update Network Assignment</h3>
                            <p class="text-sm text-gray-500 font-body">{{ subscription.plan_name }}</p>
                        </div>
                    </div>
                </div>

                <div class="px-6 py-5 space-y-5">
                    <!-- Router -->
                    <div>
                        <label for="router_id" class="block text-sm font-medium text-gray-700 mb-2">
                            Router / NAS
                        </label>
                        <select
                            id="router_id"
                            name="router_id"
                            class="w-full rounded-xl border-gray-200 shadow-sm focus:border-primary-500 focus:ring-primary-500 font-body"
                        >
                            <option value="">No router assigned</option>
                            {% for router in routers %}
                            <option value="{{ router.id }}" {{ 'selected' if subscription.router_id == router.id else '' }}>
                                {{ router.title }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>

                    <!-- IPv4 Address -->
                    <div>
                        <label for="ipv4_address" class="block text-sm font-medium text-gray-700 mb-2">
                            IPv4 Address
                        </label>
                        <input
                            type="text"
                            id="ipv4_address"
                            name="ipv4_address"
                            value="{{ subscription.ipv4_address or '' }}"
                            class="w-full rounded-xl border-gray-200 shadow-sm focus:border-primary-500 focus:ring-primary-500 font-mono"
                            placeholder="e.g., 192.168.1.100"
                        >
                        <p class="mt-1.5 text-xs text-gray-500">Enter the IPv4 address to assign to this subscription</p>
                    </div>

                    <!-- IPv6 Address -->
                    <div>
                        <label for="ipv6_address" class="block text-sm font-medium text-gray-700 mb-2">
                            IPv6 Address
                        </label>
                        <input
                            type="text"
                            id="ipv6_address"
                            name="ipv6_address"
                            value="{{ subscription.ipv6_address or '' }}"
                            class="w-full rounded-xl border-gray-200 shadow-sm focus:border-primary-500 focus:ring-primary-500 font-mono"
                            placeholder="e.g., 2001:db8::1"
                        >
                    </div>

                    <!-- MAC Address -->
                    <div>
                        <label for="mac_address" class="block text-sm font-medium text-gray-700 mb-2">
                            MAC Address
                        </label>
                        <input
                            type="text"
                            id="mac_address"
                            name="mac_address"
                            value="{{ subscription.mac_address or '' }}"
                            class="w-full rounded-xl border-gray-200 shadow-sm focus:border-primary-500 focus:ring-primary-500 font-mono"
                            placeholder="e.g., 00:11:22:33:44:55"
                        >
                        <p class="mt-1.5 text-xs text-gray-500">Customer's equipment MAC address</p>
                    </div>
                </div>

                <div class="px-6 py-4 bg-gray-50 flex items-center justify-end gap-3">
                    <button
                        type="button"
                        class="inline-flex items-center gap-2 px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-200 rounded-xl hover:bg-surface-50 hover:border-gray-300 transition-all"
                        @click="open = false; setTimeout(() => $el.closest('#modal-container').innerHTML = '', 200)"
                    >
                        Cancel
                    </button>
                    <button
                        type="submit"
                        class="inline-flex items-center gap-2 px-4 py-2 text-sm font-semibold text-white bg-gradient-to-r from-primary-600 to-primary-700 hover:from-primary-500 hover:to-primary-600 rounded-xl shadow-lg shadow-primary-600/25 transition-all"
                    >
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
                        </svg>
                        Save Changes
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
