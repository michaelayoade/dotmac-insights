{# Subscription service navigation tabs #}
<div class="mb-6">
    <div class="flex flex-wrap gap-2">
        {% for item in service_nav %}
        <a
            href="{{ item.href }}"
            class="inline-flex items-center gap-2 px-4 py-2 text-sm font-medium rounded-xl border transition-all
                {{ 'bg-primary-600 text-white border-primary-600 shadow-primary-600/20 shadow-lg' if item.is_current else 'bg-white text-gray-700 border-gray-200 hover:bg-surface-50' }}"
        >
            {{ item.label }}
        </a>
        {% endfor %}
    </div>
</div>
