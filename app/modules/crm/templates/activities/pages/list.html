{% extends "layouts/module.html" %}

{% block title %}Activities{% endblock %}

{% block content %}
<div class="space-y-6">
    <!-- Header -->
    <div class="flex items-center justify-between">
        <div>
            <h1 class="text-2xl font-semibold text-gray-900">Activities</h1>
            <p class="mt-1 text-sm text-gray-500">{{ total }} total activities</p>
        </div>
        <div class="flex gap-2">
            <a href="/crm/activities/new" class="btn btn-primary">
                <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
                </svg>
                New Activity
            </a>
        </div>
    </div>

    <!-- Quick Filters -->
    <div class="flex flex-wrap gap-2">
        <a href="/crm/activities?date_filter=today" class="btn {% if date_filter == 'today' %}btn-primary{% else %}btn-secondary{% endif %} btn-sm">Today</a>
        <a href="/crm/activities?date_filter=week" class="btn {% if date_filter == 'week' %}btn-primary{% else %}btn-secondary{% endif %} btn-sm">This Week</a>
        <a href="/crm/activities?date_filter=overdue" class="btn {% if date_filter == 'overdue' %}btn-danger{% else %}btn-secondary{% endif %} btn-sm">Overdue</a>
        <a href="/crm/activities" class="btn {% if not date_filter %}btn-primary{% else %}btn-secondary{% endif %} btn-sm">All</a>
    </div>

    <!-- Filters -->
    <div class="bg-white shadow rounded-lg p-4">
        <form hx-get="/crm/activities/table" hx-target="#activities-table" class="flex flex-wrap gap-4">
            <div class="flex-1 min-w-[200px]">
                <input type="text" name="search" value="{{ search }}" placeholder="Search activities..."
                    class="w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500"
                    hx-get="/crm/activities/table" hx-target="#activities-table" hx-trigger="keyup changed delay:300ms">
            </div>
            <div class="w-40">
                <select name="activity_type" class="w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500"
                    hx-get="/crm/activities/table" hx-target="#activities-table" hx-trigger="change">
                    <option value="">All Types</option>
                    {% for opt in type_options %}
                    <option value="{{ opt.value }}" {% if type_filter == opt.value %}selected{% endif %}>{{ opt.label }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="w-40">
                <select name="status" class="w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500"
                    hx-get="/crm/activities/table" hx-target="#activities-table" hx-trigger="change">
                    <option value="">All Statuses</option>
                    {% for opt in status_options %}
                    <option value="{{ opt.value }}" {% if status_filter == opt.value %}selected{% endif %}>{{ opt.label }}</option>
                    {% endfor %}
                </select>
            </div>
        </form>
    </div>

    <!-- Table -->
    <div id="activities-table" class="bg-white shadow rounded-lg overflow-hidden">
        {% include "modules/crm/templates/activities/partials/activities_table.html" %}
    </div>
</div>
{% endblock %}
