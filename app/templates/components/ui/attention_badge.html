{% if attention.total and attention.total > 0 %}
<a
    href="{{ attention.href }}"
    class="relative inline-flex items-center justify-center w-9 h-9 rounded-lg bg-white hover:bg-gray-100 text-gray-500 hover:text-gray-700 ring-1 ring-gray-200 transition-colors"
    title="Needs attention: {{ attention.details }}"
    data-testid="attention-button"
>
    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M5.454 19h13.092c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.722 16c-.77 1.333.192 3 1.732 3z"/>
    </svg>
    <span class="absolute -top-1 -right-1 min-w-[1.25rem] h-5 px-1 rounded-full bg-red-600 text-white text-xs font-semibold flex items-center justify-center">
        {{ attention.total }}
    </span>
</a>
{% endif %}
