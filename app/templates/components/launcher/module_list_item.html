{# Module list item component for mobile view #}
<a href="{{ module.href }}"
   class="module-icon-hover flex items-center gap-4 bg-white rounded-xl p-4 shadow-warm-sm ring-1 ring-gray-100
          hover:shadow-warm-md hover:ring-primary-200 transition-all"
   data-testid="module-list-item-{{ module.id }}">

    <!-- Icon -->
    <div class="relative flex-shrink-0">
        <div class="w-11 h-11 rounded-xl shadow-sm flex items-center justify-center module-icon module-icon--{{ module.icon_theme | default('teal') }}">
            {% set icon_name = module.icon | default('folder') %}
            {% include "components/icons/" ~ icon_name ~ ".html" ignore missing %}
        </div>
        <!-- Badge (inline, HTMX loaded) -->
        <div id="badge-mobile-{{ module.id }}"
             hx-get="/launcher/badge/{{ module.id }}"
             hx-trigger="load"
             hx-swap="innerHTML">
        </div>
    </div>

    <!-- Content -->
    <div class="flex-1 min-w-0">
        <h3 class="font-semibold module-icon-label">{{ module.name }}</h3>
        <p class="text-sm text-gray-500 truncate">{{ module.description | default("") }}</p>
    </div>

    <!-- Favorite indicator -->
    {% if module.is_favorite %}
    <span class="flex-shrink-0 text-amber-400">
        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
            <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.176 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.93 8.72c-.783-.57-.38-1.81.588-1.81h3.462a1 1 0 00.95-.69l1.07-3.292z"/>
        </svg>
    </span>
    {% endif %}

    <!-- Arrow -->
    <svg class="w-5 h-5 text-gray-400 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
    </svg>
</a>
