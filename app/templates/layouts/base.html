<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{{ product_name }} - Unified Business Management Platform">
    <title>{% block title %}{{ page_title | default("Dashboard") }}{% endblock %} | {{ product_name }}</title>
    <script>
        (function () {
            const stored = localStorage.getItem('theme');
            const prefersNight = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            const theme = stored || (prefersNight ? 'night' : 'day');
            document.documentElement.dataset.theme = theme;
            document.documentElement.style.colorScheme = theme === 'night' ? 'dark' : 'light';
        })();
    </script>

    <!-- Fonts: DM Sans (display) + Source Sans 3 (body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Source+Sans+3:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Tailwind CSS (compiled) -->
    <link href="/static/css/styles.css" rel="stylesheet">

    <style>
        /* Alpine.js x-cloak: hide elements until Alpine initializes */
        [x-cloak] { display: none !important; }

        .htmx-indicator { opacity: 0; visibility: hidden; }
        .htmx-request .htmx-indicator,
        .htmx-request.htmx-indicator { opacity: 1; visibility: visible; }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            border-radius: 0.75rem;
            font-size: 0.875rem;
            font-weight: 600;
            line-height: 1.25rem;
            padding: 0.625rem 1.25rem;
        }

        .btn-sm {
            font-size: 0.75rem;
            padding: 0.375rem 0.75rem;
        }

        .btn-primary {
            color: #fff;
            background: linear-gradient(90deg, #0d7377, #0a5f62);
            box-shadow: 0 10px 15px -3px rgba(13, 115, 119, 0.25),
                        0 4px 6px -4px rgba(13, 115, 119, 0.25);
        }

        .btn-primary:hover {
            filter: brightness(1.05);
        }

        .btn-secondary {
            background: #fff;
            color: #374151;
            border: 1px solid #e5e7eb;
            box-shadow: 0 1px 3px 0 rgba(26, 29, 33, 0.08),
                        0 1px 2px -1px rgba(26, 29, 33, 0.08);
        }

        .btn-secondary:hover {
            background: #f5f3f0;
        }

        .btn-success {
            background: #ecfdf5;
            color: #065f46;
            border: 1px solid #a7f3d0;
        }

        .btn-warning {
            background: #fffbeb;
            color: #92400e;
            border: 1px solid #fde68a;
        }

        .btn-danger {
            background: #fef2f2;
            color: #b91c1c;
            border: 1px solid #fecaca;
        }

        :root,
        :root[data-theme="day"] {
            --theme-bg: #f6f2ed;
            --theme-surface: #ffffff;
            --theme-surface-2: #fbf7f2;
            --theme-surface-3: #f1e9e2;
            --theme-border: #e3dbd2;
            --theme-text: #1f2a33;
            --theme-text-muted: #58656f;
            --theme-text-subtle: #768391;
            --theme-primary: #0d7377;
            --theme-primary-strong: #0a5f62;
            --theme-accent: #f2a65d;
            --theme-ring: rgba(13, 115, 119, 0.35);
            --theme-card-shadow: 0 12px 30px rgba(31, 42, 51, 0.14);
        }

        :root[data-theme="night"] {
            --theme-bg: #0e1317;
            --theme-surface: #161c21;
            --theme-surface-2: #1b232a;
            --theme-surface-3: #11171c;
            --theme-border: #28313a;
            --theme-text: #e6edf3;
            --theme-text-muted: #bac6d1;
            --theme-text-subtle: #93a3b3;
            --theme-primary: #4fd1c5;
            --theme-primary-strong: #2bb7a8;
            --theme-accent: #f2c66d;
            --theme-ring: rgba(79, 209, 197, 0.35);
            --theme-card-shadow: 0 18px 40px rgba(5, 8, 12, 0.55);
        }

        html, body {
            background: var(--theme-bg);
            color: var(--theme-text);
        }

        .theme-bg { background: var(--theme-bg); color: var(--theme-text); }
        .theme-surface { background: var(--theme-surface); color: var(--theme-text); }
        .theme-surface-2 { background: var(--theme-surface-2); }
        .theme-border { border-color: var(--theme-border); }
        .theme-text { color: var(--theme-text); }
        .theme-muted { color: var(--theme-text-muted); }
        .theme-surface-glass { background: color-mix(in srgb, var(--theme-surface) 88%, transparent); }
        .theme-surface-muted { background: color-mix(in srgb, var(--theme-surface) 70%, transparent); }

        .theme-toggle {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            padding: 0.35rem 0.65rem;
            border-radius: 0.75rem;
            border: 1px solid var(--theme-border);
            background: var(--theme-surface-2);
            color: var(--theme-text-muted);
            font-size: 0.75rem;
            line-height: 1rem;
            transition: transform 150ms ease, background 150ms ease, color 150ms ease, border-color 150ms ease;
        }

        .theme-toggle:hover {
            color: var(--theme-text);
            transform: translateY(-1px);
        }

        .theme-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: opacity 150ms ease, transform 150ms ease;
        }

        .theme-icon-night { opacity: 0; transform: translateY(2px) scale(0.9); }
        :root[data-theme="night"] .theme-icon-night { opacity: 1; transform: translateY(0) scale(1); }
        :root[data-theme="night"] .theme-icon-day { opacity: 0; transform: translateY(-2px) scale(0.9); }

        :root[data-theme="night"] .bg-white { background-color: var(--theme-surface); }
        :root[data-theme="night"] .bg-gray-50 { background-color: var(--theme-surface-2); }
        :root[data-theme="night"] .bg-gray-100 { background-color: var(--theme-surface-3); }
        :root[data-theme="night"] .bg-surface-50,
        :root[data-theme="night"] .bg-surface-100 { background-color: var(--theme-bg); }
        :root[data-theme="night"] .bg-surface-200 { background-color: var(--theme-surface-2); }
        :root[data-theme="night"] .bg-surface-300 { background-color: var(--theme-surface-3); }

        :root[data-theme="night"] .text-gray-900,
        :root[data-theme="night"] .text-gray-800 { color: var(--theme-text); }
        :root[data-theme="night"] .text-gray-700,
        :root[data-theme="night"] .text-gray-600 { color: var(--theme-text-muted); }
        :root[data-theme="night"] .text-gray-500,
        :root[data-theme="night"] .text-gray-400 { color: var(--theme-text-subtle); }

        :root[data-theme="night"] .border-gray-200,
        :root[data-theme="night"] .border-gray-100,
        :root[data-theme="night"] .border-surface-200,
        :root[data-theme="night"] .border-surface-300 { border-color: var(--theme-border); }

        :root[data-theme="night"] .shadow-sm,
        :root[data-theme="night"] .shadow,
        :root[data-theme="night"] .shadow-md,
        :root[data-theme="night"] .shadow-lg,
        :root[data-theme="night"] .shadow-warm-md,
        :root[data-theme="night"] .shadow-warm-lg {
            box-shadow: var(--theme-card-shadow);
        }

        :root[data-theme="night"] input,
        :root[data-theme="night"] select,
        :root[data-theme="night"] textarea {
            background-color: var(--theme-surface-2);
            border-color: var(--theme-border);
            color: var(--theme-text);
        }

        :root[data-theme="night"] input::placeholder,
        :root[data-theme="night"] textarea::placeholder {
            color: var(--theme-text-subtle);
        }

        input:focus, select:focus, textarea:focus {
            --tw-ring-color: var(--theme-ring);
        }

        .btn-primary {
            background: linear-gradient(90deg, var(--theme-primary), var(--theme-primary-strong));
        }

        .btn-secondary {
            background: var(--theme-surface);
            color: var(--theme-text-muted);
            border: 1px solid var(--theme-border);
        }

        .theme-hover:hover {
            background: var(--theme-surface-2);
        }

        .theme-launcher {
            background:
                radial-gradient(1200px 600px at 10% -10%, rgba(13, 115, 119, 0.12), transparent 60%),
                radial-gradient(900px 500px at 95% 0%, rgba(242, 166, 93, 0.18), transparent 55%),
                linear-gradient(180deg, rgba(255, 255, 255, 0.9), rgba(246, 242, 237, 0.95));
        }

        :root[data-theme="night"] .theme-launcher {
            background:
                radial-gradient(1200px 600px at 10% -10%, rgba(79, 209, 197, 0.16), transparent 60%),
                radial-gradient(900px 500px at 95% 0%, rgba(242, 198, 109, 0.18), transparent 55%),
                linear-gradient(180deg, rgba(14, 19, 23, 0.98), rgba(10, 14, 18, 0.95));
        }

        .module-icon {
            background: var(--module-icon-bg, var(--theme-surface-3));
            color: var(--module-icon-fg, var(--theme-text));
        }

        .module-icon-hover:hover .module-icon,
        .module-icon-hover:focus-visible .module-icon {
            background: var(--module-icon-bg-hover, var(--module-icon-bg, var(--theme-surface-3)));
            color: var(--module-icon-fg-hover, var(--module-icon-fg, var(--theme-text)));
        }

        .module-icon-label {
            color: var(--module-label-fg, var(--theme-text));
        }

        .module-icon-hover:hover .module-icon-label,
        .module-icon-hover:focus-visible .module-icon-label {
            color: var(--module-icon-fg-hover, var(--module-icon-fg, var(--theme-text)));
        }

        .module-icon--customer { --module-icon-bg: #fde7cf; --module-icon-fg: #a35d14; }
        .module-icon--finance { --module-icon-bg: #dff6ea; --module-icon-fg: #166b4e; }
        .module-icon--procurement { --module-icon-bg: #ffe2c4; --module-icon-fg: #9a4b10; }
        .module-icon--facility { --module-icon-bg: #ede9e2; --module-icon-fg: #6c5a48; }
        .module-icon--operations { --module-icon-bg: #dff1ff; --module-icon-fg: #1b5f8a; }
        .module-icon--isp { --module-icon-bg: #dcf7fb; --module-icon-fg: #1a6d7a; }
        .module-icon--people { --module-icon-bg: #ece5ff; --module-icon-fg: #5a34a8; }
        .module-icon--marketing { --module-icon-bg: #ffe3ed; --module-icon-fg: #9a2f56; }
        .module-icon--analytics { --module-icon-bg: #e2e7ff; --module-icon-fg: #2f3f99; }
        .module-icon--system { --module-icon-bg: #e4e9ef; --module-icon-fg: #3e4a57; }
        .module-icon--teal { --module-icon-bg: #d7f6f2; --module-icon-fg: #0f6b60; }
        .module-icon--lime { --module-icon-bg: #edf7c9; --module-icon-fg: #5b6f12; }
        .module-icon--rose { --module-icon-bg: #ffe1e8; --module-icon-fg: #9f1f3f; }
        .module-icon--purple { --module-icon-bg: #efe2ff; --module-icon-fg: #5b2aa4; }

        .module-icon--customer { --module-icon-bg-hover: #f7d9b4; --module-icon-fg-hover: #8a4d10; }
        .module-icon--finance { --module-icon-bg-hover: #c7eddc; --module-icon-fg-hover: #12563f; }
        .module-icon--procurement { --module-icon-bg-hover: #f8cfa8; --module-icon-fg-hover: #7d3f0f; }
        .module-icon--facility { --module-icon-bg-hover: #e0d6cc; --module-icon-fg-hover: #5a4b3d; }
        .module-icon--operations { --module-icon-bg-hover: #c8e6ff; --module-icon-fg-hover: #154c70; }
        .module-icon--isp { --module-icon-bg-hover: #c5eef4; --module-icon-fg-hover: #145662; }
        .module-icon--people { --module-icon-bg-hover: #d9ccff; --module-icon-fg-hover: #4c2c92; }
        .module-icon--marketing { --module-icon-bg-hover: #ffc8da; --module-icon-fg-hover: #7e2345; }
        .module-icon--analytics { --module-icon-bg-hover: #c8d3ff; --module-icon-fg-hover: #24347f; }
        .module-icon--system { --module-icon-bg-hover: #d4dbe3; --module-icon-fg-hover: #333e49; }
        .module-icon--teal { --module-icon-bg-hover: #bfeae4; --module-icon-fg-hover: #0b524a; }
        .module-icon--lime { --module-icon-bg-hover: #dfeeb0; --module-icon-fg-hover: #4c5d10; }
        .module-icon--rose { --module-icon-bg-hover: #fbc1d0; --module-icon-fg-hover: #7f1833; }
        .module-icon--purple { --module-icon-bg-hover: #e0ccff; --module-icon-fg-hover: #4a228a; }

        :root[data-theme="night"] .module-icon--customer { --module-icon-bg: #3a2b1c; --module-icon-fg: #f7c58a; }
        :root[data-theme="night"] .module-icon--finance { --module-icon-bg: #1c3228; --module-icon-fg: #7fe3b6; }
        :root[data-theme="night"] .module-icon--procurement { --module-icon-bg: #3b2718; --module-icon-fg: #f6b374; }
        :root[data-theme="night"] .module-icon--facility { --module-icon-bg: #2b2621; --module-icon-fg: #d9c6b3; }
        :root[data-theme="night"] .module-icon--operations { --module-icon-bg: #1c2a35; --module-icon-fg: #89c6e8; }
        :root[data-theme="night"] .module-icon--isp { --module-icon-bg: #1c2f33; --module-icon-fg: #7dd7e3; }
        :root[data-theme="night"] .module-icon--people { --module-icon-bg: #2c243a; --module-icon-fg: #c3a6ff; }
        :root[data-theme="night"] .module-icon--marketing { --module-icon-bg: #3b2029; --module-icon-fg: #f49ab6; }
        :root[data-theme="night"] .module-icon--analytics { --module-icon-bg: #23283b; --module-icon-fg: #aab5ff; }
        :root[data-theme="night"] .module-icon--system { --module-icon-bg: #252b33; --module-icon-fg: #b3c0ce; }
        :root[data-theme="night"] .module-icon--teal { --module-icon-bg: #17312f; --module-icon-fg: #7de0d6; }
        :root[data-theme="night"] .module-icon--lime { --module-icon-bg: #2b3318; --module-icon-fg: #c7de6b; }
        :root[data-theme="night"] .module-icon--rose { --module-icon-bg: #3a1d24; --module-icon-fg: #f4a0b4; }
        :root[data-theme="night"] .module-icon--purple { --module-icon-bg: #2b2038; --module-icon-fg: #c7a3ff; }

        :root[data-theme="night"] .module-icon--customer { --module-icon-bg-hover: #4a3522; --module-icon-fg-hover: #ffd39c; }
        :root[data-theme="night"] .module-icon--finance { --module-icon-bg-hover: #244437; --module-icon-fg-hover: #9af0c6; }
        :root[data-theme="night"] .module-icon--procurement { --module-icon-bg-hover: #4b2f1c; --module-icon-fg-hover: #ffc58a; }
        :root[data-theme="night"] .module-icon--facility { --module-icon-bg-hover: #34302a; --module-icon-fg-hover: #e7d6c6; }
        :root[data-theme="night"] .module-icon--operations { --module-icon-bg-hover: #233444; --module-icon-fg-hover: #a5d4ef; }
        :root[data-theme="night"] .module-icon--isp { --module-icon-bg-hover: #23373c; --module-icon-fg-hover: #9ae4ee; }
        :root[data-theme="night"] .module-icon--people { --module-icon-bg-hover: #3a2f4b; --module-icon-fg-hover: #d8c2ff; }
        :root[data-theme="night"] .module-icon--marketing { --module-icon-bg-hover: #4a2731; --module-icon-fg-hover: #ffb5cd; }
        :root[data-theme="night"] .module-icon--analytics { --module-icon-bg-hover: #2b3149; --module-icon-fg-hover: #c1c9ff; }
        :root[data-theme="night"] .module-icon--system { --module-icon-bg-hover: #2f3640; --module-icon-fg-hover: #c9d5e1; }
        :root[data-theme="night"] .module-icon--teal { --module-icon-bg-hover: #1b3f3c; --module-icon-fg-hover: #9beee5; }
        :root[data-theme="night"] .module-icon--lime { --module-icon-bg-hover: #36411f; --module-icon-fg-hover: #d8f081; }
        :root[data-theme="night"] .module-icon--rose { --module-icon-bg-hover: #47222b; --module-icon-fg-hover: #ffb2c4; }
        :root[data-theme="night"] .module-icon--purple { --module-icon-bg-hover: #352544; --module-icon-fg-hover: #dec0ff; }
    </style>

    {% block head %}{% endblock %}
</head>
<body
    class="h-full theme-bg font-body antialiased"
    hx-headers='{"X-CSRF-Token": "{{ csrf_token }}"}'
    x-data="{ sidebarOpen: false }"
    data-product-name="{{ product_name }}"
>
    {% block body %}{% endblock %}

    <!-- Toast Container -->
    <div
        id="toast-container"
        class="fixed top-4 right-4 z-50 flex flex-col gap-3 pointer-events-none"
        x-data="toastManager()"
        @show-toast.window="show($event.detail)"
        aria-live="polite"
    >
        <template x-for="toast in toasts" :key="toast.id">
            <div
                class="pointer-events-auto max-w-sm w-full overflow-hidden rounded-xl shadow-warm-lg"
                :class="{
                    'animate-slide-in-right': toast.entering,
                    'animate-slide-out-right': toast.leaving,
                    'bg-emerald-50 border border-emerald-200': toast.type === 'success',
                    'bg-red-50 border border-red-200': toast.type === 'error',
                    'bg-amber-50 border border-amber-200': toast.type === 'warning',
                    'bg-primary-50 border border-primary-200': toast.type === 'info'
                }"
                x-show="!toast.hidden"
                data-testid="toast"
                :data-toast-type="toast.type"
            >
                <div class="p-4 flex items-start gap-3">
                    <div class="flex-shrink-0 mt-0.5">
                        <template x-if="toast.type === 'success'">
                            <div class="w-5 h-5 rounded-full bg-emerald-500 flex items-center justify-center">
                                <svg class="h-3 w-3 text-white" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M2.5 6.5l2.5 2.5 4.5-5" stroke-linecap="round" stroke-linejoin="round"/>
                                </svg>
                            </div>
                        </template>
                        <template x-if="toast.type === 'error'">
                            <div class="w-5 h-5 rounded-full bg-red-500 flex items-center justify-center">
                                <svg class="h-3 w-3 text-white" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M3 3l6 6M9 3l-6 6" stroke-linecap="round"/>
                                </svg>
                            </div>
                        </template>
                        <template x-if="toast.type === 'warning'">
                            <div class="w-5 h-5 rounded-full bg-amber-500 flex items-center justify-center">
                                <svg class="h-3 w-3 text-white" viewBox="0 0 12 12" fill="currentColor">
                                    <path d="M6 3v4M6 9v.01"/>
                                </svg>
                            </div>
                        </template>
                        <template x-if="toast.type === 'info'">
                            <div class="w-5 h-5 rounded-full bg-primary-600 flex items-center justify-center">
                                <svg class="h-3 w-3 text-white" viewBox="0 0 12 12" fill="currentColor">
                                    <circle cx="6" cy="3.5" r="0.75"/>
                                    <path d="M5 6h2v3.5H5z"/>
                                </svg>
                            </div>
                        </template>
                    </div>
                    <div class="flex-1 min-w-0">
                        <p class="text-sm font-medium"
                           :class="{
                               'text-emerald-900': toast.type === 'success',
                               'text-red-900': toast.type === 'error',
                               'text-amber-900': toast.type === 'warning',
                               'text-primary-900': toast.type === 'info'
                           }"
                           x-text="toast.message"></p>
                    </div>
                    <button
                        type="button"
                        class="flex-shrink-0 rounded-md p-1 transition-colors"
                        :class="{
                            'text-emerald-500 hover:bg-emerald-100': toast.type === 'success',
                            'text-red-500 hover:bg-red-100': toast.type === 'error',
                            'text-amber-600 hover:bg-amber-100': toast.type === 'warning',
                            'text-primary-600 hover:bg-primary-100': toast.type === 'info'
                        }"
                        @click="dismiss(toast.id)"
                    >
                        <span class="sr-only">Close</span>
                        <svg class="h-4 w-4" viewBox="0 0 16 16" fill="currentColor">
                            <path d="M4.28 3.22a.75.75 0 00-1.06 1.06L6.94 8l-3.72 3.72a.75.75 0 101.06 1.06L8 9.06l3.72 3.72a.75.75 0 101.06-1.06L9.06 8l3.72-3.72a.75.75 0 00-1.06-1.06L8 6.94 4.28 3.22z"/>
                        </svg>
                    </button>
                </div>
            </div>
        </template>
    </div>

    <!-- Modal Container -->
    <div
        id="modal-container"
        x-data="{ open: false }"
        @open-modal.window="open = true"
        @close-modal.window="open = false"
        x-show="open"
        x-cloak
        class="fixed inset-0 z-40 overflow-y-auto"
        aria-labelledby="modal-title"
        role="dialog"
        aria-modal="true"
    >
        <h2 id="modal-title" class="sr-only">Dialog</h2>
        <!-- Backdrop -->
        <div
            class="fixed inset-0 bg-slate-950/60 backdrop-blur-sm"
            x-show="open"
            x-transition:enter="ease-out duration-300"
            x-transition:enter-start="opacity-0"
            x-transition:enter-end="opacity-100"
            x-transition:leave="ease-in duration-200"
            x-transition:leave-start="opacity-100"
            x-transition:leave-end="opacity-0"
            @click="open = false"
        ></div>

        <!-- Modal Panel -->
        <div class="flex min-h-full items-center justify-center p-4">
            <div
                id="modal-content"
                class="relative w-full max-w-lg transform overflow-hidden rounded-2xl bg-white shadow-warm-xl"
                x-show="open"
                x-transition:enter="ease-out duration-300"
                x-transition:enter-start="opacity-0 scale-95"
                x-transition:enter-end="opacity-100 scale-100"
                x-transition:leave="ease-in duration-200"
                x-transition:leave-start="opacity-100 scale-100"
                x-transition:leave-end="opacity-0 scale-95"
                @click.stop
            >
                <!-- Modal content injected by HTMX -->
            </div>
        </div>
    </div>

    <!-- Flash Message (from server) -->
{% if flash %}
    <script>
        const dispatchFlashToast = () => {
            window.dispatchEvent(new CustomEvent('show-toast', {
                detail: {
                    message: {{ flash.message | tojson }},
                    type: {{ flash.category | tojson }}
                }
            }));
        };
        if (document.readyState === "loading") {
            document.addEventListener('DOMContentLoaded', dispatchFlashToast);
        } else {
            dispatchFlashToast();
        }
    </script>
{% endif %}

    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@2.0.4" integrity="sha384-HGfztofotfshcF7+8n44JQL2oJmowVChPTg48S+jvZoztPfvwD79OC/LTtG6dMp+" crossorigin="anonymous"></script>

    <!-- UI components (must load before Alpine) -->
    <script src="/static/js/ui.js"></script>
    <script src="/static/js/table-actions.js"></script>
    <script>
        (function () {
            function applyTheme(nextTheme) {
                document.documentElement.dataset.theme = nextTheme;
                document.documentElement.style.colorScheme = nextTheme === 'night' ? 'dark' : 'light';
                localStorage.setItem('theme', nextTheme);
            }

            function toggleTheme() {
                const current = document.documentElement.dataset.theme || 'day';
                applyTheme(current === 'night' ? 'day' : 'night');
            }

            function initThemeToggles() {
                document.querySelectorAll('[data-theme-toggle]').forEach((button) => {
                    button.addEventListener('click', toggleTheme);
                });
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', initThemeToggles);
            } else {
                initThemeToggles();
            }
        })();
    </script>

    <!-- Alpine.js -->
    <script defer src="/static/js/vendor/alpine.min.js"></script>

    {% block scripts %}{% endblock %}
</body>
</html>
