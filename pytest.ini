[pytest]
# =============================================================================
# PYTEST CONFIGURATION - DotMAC Insights
# =============================================================================

# Test paths
testpaths = tests

# Python path
pythonpath = .

# Default options
addopts =
    -v
    --tb=short
    --strict-markers
    -ra

# Timeout for individual tests (seconds)
timeout = 300

# Async mode
asyncio_mode = auto

# =============================================================================
# MARKERS
# =============================================================================

markers =
    # Priority Markers
    critical: Critical path tests - must pass on every commit
    smoke: Quick sanity checks for deployment verification
    slow: Tests that take longer than 10 seconds

    # Type Markers
    unit: Isolated unit tests with mocked dependencies
    integration: Tests with real database operations
    e2e: End-to-end workflow tests
    security: Security-focused tests (RBAC, injection, etc.)
    performance: Performance and benchmark tests

    # Module Markers
    accounting: Accounting module tests
    crm: CRM module tests
    hr: HR module tests
    support: Support/ticketing module tests
    field_service: Field service module tests
    inbox: Inbox/conversations module tests
    inventory: Inventory module tests
    expenses: Expense management tests
    projects: Project management tests
    tax: Tax compliance tests
    payroll: Payroll processing tests
    performance_mgmt: Performance management/reviews tests
    contacts: Contacts/CRM tests
    purchasing: Purchasing/AP tests
    sales: Sales/AR tests
    notifications: Notification system tests
    sync: Data sync and reconciliation tests
    auth: Authentication and authorization tests
    admin: Admin and settings tests

    # Feature Markers
    workflow: Multi-step workflow tests
    approval: Approval engine tests
    reconciliation: Reconciliation tests
    posting: GL posting tests
    allocation: Payment allocation tests

# =============================================================================
# WARNINGS
# =============================================================================

filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::pytest.PytestUnraisableExceptionWarning

# =============================================================================
# COVERAGE CONFIGURATION
# =============================================================================

# Run with: pytest --cov=app --cov-report=html --cov-report=term-missing

# Coverage thresholds by module:
# - Overall: 60% minimum, 70% target
# - Critical services: 85% minimum, 90% target
# - API endpoints: 70% minimum, 80% target

# =============================================================================
# PARALLEL EXECUTION
# =============================================================================

# Run with: pytest -n auto (requires pytest-xdist)
# Exclude tests that can't run in parallel with: @pytest.mark.serial

# =============================================================================
# DATABASE CONFIGURATION
# =============================================================================

# Integration tests use TEST_DATABASE_URL environment variable
# Default: SQLite in-memory for unit tests
# Recommended: PostgreSQL for integration tests

# Set via environment:
# TEST_DATABASE_URL=postgresql+psycopg://user:pass@localhost:5432/test_db
